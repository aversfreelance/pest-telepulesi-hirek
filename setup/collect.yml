name: Települési hírek frissítése
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Budapest
permissions:
  contents: write
concurrency:
  group: municipality-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python collect.py
      - name: JSON fájlok mentése
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news.json public/status.json
          if [ -f data/collection-state.json ]; then git add data/collection-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Friss települési hírek'
            git push
          fi
